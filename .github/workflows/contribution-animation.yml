# .github/workflows/contribution-animation.yml
name: Contribution Animation
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Man0dya/Readme-Contribution-Graph-Generator@main
        with:
          github_user_name: xsfxtsxxr
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution graph"
          file_pattern: "github-contribution-animation.svg"